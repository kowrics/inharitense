services:
  web:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: inharitense
      POSTGRES_USER: inharitense
      POSTGRES_PASSWORD: CHANGE_ME
    volumes:
      - inharitense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inharitense -d inharitense"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  inharitense_pgdata:
